# S1-04 PR pipeline (Blueprint §11 "PR" stage; SEC-S1-15; ADR-0024).
# Every third-party action is pinned to a full commit SHA; the gitleaks binary is pinned by SHA-256.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only token for every job unless a job widens it.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --max-time 120 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Scan full git history
        # --redact keeps any finding's secret value out of the job log.
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --verbose --no-banner --exit-code 1

  build-test:
    name: Build, test, format, vulnerable packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        working-directory: backend
        run: dotnet restore IAM.slnx -p:ContinuousIntegrationBuild=true

      - name: Build (warnings as errors, analyzers)
        working-directory: backend
        run: dotnet build IAM.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test (unit + architecture)
        working-directory: backend
        run: dotnet test --solution IAM.slnx -c Release --no-build

      - name: Format check
        working-directory: backend
        run: dotnet format IAM.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Vulnerable package gate (direct + transitive)
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet list IAM.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable.txt"; then
            echo "::error::Vulnerable NuGet packages found (see log above)."
            exit 1
          fi

  # Database parity matrix (SQL Server + PostgreSQL, ADR-0010) is added with S1-06,
  # when persistence exists. It is intentionally absent here, not skipped.
